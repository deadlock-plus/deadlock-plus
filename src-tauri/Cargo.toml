[package]
name = "deadlock-plus"
version = "0.3.0"
description = "Companion app for Deadlock: server picker, connection monitor, mutes, replays and storage"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "deadlock_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["process", "sync", "time", "rt"] }
futures = "0.3"
thiserror = "2"
sysinfo = "0.33"
notify = "8"
steamlocate = "2"
base64 = "0.23.1"
trash = "5"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
log = "0.4.34"
tauri-plugin-log = "2.9.2"
flate2 = "1.1.10"
# Rasterizes the unread-count digits drawn onto the tray/taskbar badge icons.
ab_glyph = "0.2"
time = { version = "0.3", features = ["local-offset"] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
ts-rs = "12"
regex = "1"
# Pinned exact and matching: 0.21.14's optimizer has a genuine infinite loop repeatedly
# "transposing" the same EinSumMatMul nodes back and forth in this model's graph (confirmed via
# debug log: 400,000+ repeated patches and climbing, unbounded memory growth). 0.21.18 does not
# exhibit this. Left unpinned, Cargo also resolves tract-data ahead of the other tract-* crates,
# which is its own source of trouble — pin everything to the same version.
tract-onnx = "=0.21.18"
tract-data = "=0.21.18"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_NetworkManagement_WindowsFirewall", "Win32_NetworkManagement_IpHelper", "Win32_System_Com", "Win32_Foundation", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_Security", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
ferrisetw = "1.2.0"
# Matches the version tauri itself depends on, so `WebviewWindow::window_handle()` (raw-window-handle)
# hands back a type we can use directly, instead of pulling in a second, incompatible semver line.
raw-window-handle = "0.6"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true


