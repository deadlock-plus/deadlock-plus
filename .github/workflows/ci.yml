name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: pnpm version:check
        working-directory: apps/desktop
      - run: pnpm format:check
        working-directory: apps/desktop
      - run: pnpm check
        working-directory: apps/desktop
      - run: pnpm test
        working-directory: apps/desktop
      - run: pnpm build
        working-directory: apps/desktop

      - run: cargo fmt --check -- --config max_width=120,use_small_heuristics=Max
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --lib --tests -- -D warnings
        working-directory: apps/desktop/src-tauri
      - run: cargo test --lib
        working-directory: apps/desktop/src-tauri
      - name: Generated types are current
        shell: bash
        run: |
          git diff --exit-code -- apps/desktop/src/lib/generated/types
          test -z "$(git ls-files --others --exclude-standard -- apps/desktop/src/lib/generated/types)"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: pnpm audit --prod --audit-level=moderate
        working-directory: apps/desktop

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
        working-directory: apps/desktop/src-tauri
