name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patchelf protobuf-compiler libprotobuf-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Install protoc
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc
        if: runner.os == 'Windows'
        run: choco install protoc --no-progress -y

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .

      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: pnpm version:check
        working-directory: apps/desktop
      - run: pnpm tiers:check
        working-directory: apps/desktop
      - run: pnpm layers:check
        working-directory: apps/desktop
      - run: pnpm format:check
        working-directory: apps/desktop
      - run: pnpm check
        working-directory: apps/desktop
      - run: pnpm test
        working-directory: apps/desktop
      # The Tauri crate embeds the built frontend at compile time, so clippy and tests need it.
      - run: pnpm build
        working-directory: apps/desktop

      - name: Format
        if: runner.os == 'Windows'
        run: cargo fmt --all --check -- --config max_width=120,use_small_heuristics=Max
      - run: cargo clippy --workspace --lib --tests -- -D warnings
      - run: cargo test --workspace --lib

      - name: Build Vulkan frame layer
        if: runner.os == 'Linux'
        run: cargo build -p dp-frames-layer --release

      - name: Generated types are current
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git diff --exit-code -- apps/desktop/src/lib/generated/types
          test -z "$(git ls-files --others --exclude-standard -- apps/desktop/src/lib/generated/types)"

  # Compiles every crate below the app for a target the runner is not (or not only) building natively. The app crate is
  # excluded: it needs the target's webview libraries, and the native jobs above already build it.
  cross-check:
    name: cross-check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install musl C toolchain and protoc
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools protobuf-compiler libprotobuf-dev

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .
          key: ${{ matrix.target }}

      - name: Check crates
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo check --workspace --exclude deadlock-plus --lib --tests --target ${{ matrix.target }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: pnpm audit --prod --audit-level=moderate
        working-directory: apps/desktop

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-audit
      - run: cargo audit
