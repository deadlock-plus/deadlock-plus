name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

      - run: cargo fmt --check -- --config max_width=120,use_small_heuristics=Max
        working-directory: src-tauri
      - run: cargo clippy --lib --tests -- -D warnings
        working-directory: src-tauri
      - run: cargo test --lib
        working-directory: src-tauri
      - name: Generated types are current
        shell: bash
        run: |
          git status --porcelain -- src/lib/generated/types
          git ls-files --eol src/lib/generated/types/Demo.ts
          git diff -- src/lib/generated/types/Demo.ts | head -30 | cat -A
          test -z "$(git status --porcelain -- src/lib/generated/types)"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=moderate

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
        working-directory: src-tauri
