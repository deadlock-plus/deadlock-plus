name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Holds the update signing key, so it gets no write access to the repo. The key is only in the environment of the
  # steps that sign; dependency install and tests never see it.
  build:
    runs-on: windows-latest
    env:
      # Code signing runs only once the SignPath project exists and this variable is set.
      SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install protoc
        shell: pwsh
        run: |
          $v = '36.0'
          $zip = Join-Path $env:RUNNER_TEMP 'protoc.zip'
          Invoke-WebRequest "https://github.com/protocolbuffers/protobuf/releases/download/v$v/protoc-$v-win64.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '510FB2369A4720ADB457783768C5E1481A0E1137D9E7694478DFE9B8FE445DC1') { throw 'protoc checksum mismatch' }
          $dir = Join-Path $env:RUNNER_TEMP 'protoc'
          Expand-Archive $zip $dir
          "PROTOC=$dir\bin\protoc.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PROTOC_INCLUDE=$dir\include" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .

      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: pnpm version:check
        working-directory: apps/desktop

      - name: Tag matches package version
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match apps/desktop/package.json version ${version}"; exit 1; }

      - run: pnpm check
        working-directory: apps/desktop
      - run: pnpm test
        working-directory: apps/desktop

      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build
        working-directory: apps/desktop

      - name: Upload unsigned installer
        if: env.SIGNPATH_ENABLED == 'true'
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-installer
          path: target/release/bundle/nsis/*-setup.exe

      - name: Sign installer with SignPath
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: deadlock-plus
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # The updater signature covers the installer bytes, so it must be redone after Authenticode signing.
      - name: Replace installer and redo the updater signature
        if: env.SIGNPATH_ENABLED == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          signed="$(find signed -name '*-setup.exe' | head -n 1)"
          [ -n "$signed" ] || { echo "SignPath returned no installer"; exit 1; }
          target="$(ls target/release/bundle/nsis/*-setup.exe)"
          cp "$signed" "$target"
          (cd apps/desktop && pnpm tauri signer sign "$OLDPWD/$target")

      - name: Prepare release files
        env:
          REPOSITORY: ${{ github.repository }}
        run: node scripts/release.mjs prepare "$env:REPOSITORY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-out
          path: release-out
          if-no-files-found: error

  # Runs no project code: it only publishes what the build job produced.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-out
          path: release-out

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${REPOSITORY}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-out/notes.md \
            release-out/Deadlock-Plus_*_x64-setup.exe \
            release-out/latest.json
