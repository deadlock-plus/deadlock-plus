name: Announce release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  announce:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Check Discord webhook
        id: gate
        env:
          WEBHOOK: ${{ secrets.DISCORD_UPDATES_WEBHOOK }}
        run: |
          if [ -n "$WEBHOOK" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DISCORD_UPDATES_WEBHOOK is not set; skipping."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          sparse-checkout: apps/discord-updates

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 24

      - name: Post to Discord
        if: steps.gate.outputs.enabled == 'true'
        env:
          DISCORD_UPDATES_WEBHOOK: ${{ secrets.DISCORD_UPDATES_WEBHOOK }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: node apps/discord-updates/announce.mjs
