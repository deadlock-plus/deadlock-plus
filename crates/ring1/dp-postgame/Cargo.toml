valveprotos = { git = "https://github.com/deadlock-api/deadlock-api", rev = "19a34aa9cedabd3374cb4af5c2d714520784ce1f", features = ["gc-common", "gc-client"] }
deadlock-reader = { git = "https://github.com/deadlock-plus/deadlock-rs", rev = "baa7a8ebd1d1485b6913b9762902825d5c73a084" }
deadlock-events = { git = "https://github.com/deadlock-plus/deadlock-rs", rev = "baa7a8ebd1d1485b6913b9762902825d5c73a084" }

[dev-dependencies]
serde_json = "1"
