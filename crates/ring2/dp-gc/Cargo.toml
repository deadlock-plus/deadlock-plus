[package]
name = "dp-gc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.dp]
tier = 2

[dependencies]
aes = "0.8"
base64 = "0.23.1"
cbc = { version = "0.1", features = ["alloc"] }
crc32fast = "1"
hex = "0.4"
keyvalues-parser = "0.2"
log = "0.4.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time"] }
prost = "0.14"
steam-vent = { git = "https://github.com/deadlock-api/steam-vent", rev = "098ae675ab698d642e93c4c650cab79f3fc7d130" }
valveprotos = { git = "https://github.com/deadlock-api/deadlock-api", rev = "328a51b6b1857a9092d3dd1e5c79609a2e61202d", features = ["gc-common", "gc-client"] }

[target.'cfg(windows)'.dependencies]
windows-dpapi = "0.2"
