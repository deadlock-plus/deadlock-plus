[package]
name = "dp-network"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.dp]
tier = 2

[dependencies]
dp-atomic = { path = "../../ring0/dp-atomic" }
dp-connection = { path = "../../ring1/dp-connection" }
dp-game = { path = "../../ring1/dp-game" }
dp-icmp = { path = "../../ring1/dp-icmp" }
dp-sync = { path = "../../ring0/dp-sync" }
log = "0.4.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
ts-rs = "12"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "time", "macros"] }
